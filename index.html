<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>War Games Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h1>Shall we play a game?</h1>
        <div id="mode-selection">
            <button id="single-player">1 Player</button>
            <button id="two-player">2 Player</button>
        </div>
        <canvas id="game-canvas"></canvas>
        <div id="status">Select mode to begin.</div>
        <div id="game-buttons" style="display:none;">
            <button id="play-again">Play Again</button>
            <button id="reset">Reset Game</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
